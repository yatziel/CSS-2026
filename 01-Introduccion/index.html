<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introducción a CSS 🖍️</title>
</head>
<body>
    <!-- 1. CSS dentro del elemento <style>...</style> -->
     <style>

        h1 {
          color: red;
          font-size: 200px;
        }

     </style>
    
    <h1>Introducción a CSS</h1>

    <!-- 2. Escribimos CSS en línea. Dentro de la etiqueta de apertura de un elemento de html-->

    <p style="color:purple; font-size:48px">Lorem ipsum dolor sit amet consectetur adipisicing elit. Sunt, fuga dolor? Iure facilis porro soluta. Laboriosam quaerat mollitia reprehenderit dignissimos eligendi, expedita magnam, illo provident dolores, obcaecati amet itaque. At!</p>

     <!-- 3. Escribimos CSS en un documento externo y lo llamamos a travé de el elemento link -->
    
    <h2>CSS externo</h2>
    <link rel="stylesheet" href="./style.css" >
</body>
</html>
